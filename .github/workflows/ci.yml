name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: DevCompass CI Pipeline
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Validate Syntax & ShellCheck
        run: make lint

      - name: Run Test Suite
        run: make test

      - name: Run Smoke Tests
        run: make smoke
